[project]
name = "agentlab-sdk"
version = "0.1.0"
description = "Agent Lab SDK: protocols, transport, knowledge, TeamAgent wrapper"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "google-adk>=2.8.0",
    "pydantic>=2.13",
    "pyyaml>=6.0.3",
    "httpx>=0.28",
    "websockets>=15.0.1,<16",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlab"]
