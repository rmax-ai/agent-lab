[project]
name = "agentlab-cli"
version = "0.1.0"
description = "Agent Lab CLI: the local dev loop (SPEC §26) — dev, scenario, trace, status, init"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.15",
    "uvicorn>=0.30",
    "httpx>=0.28",
    "agentlab-sdk",
    "agentlab-backend",
    "agentlab-world",
]

[project.scripts]
agent-lab = "agentlab.cli.main:app"

[tool.uv.sources]
agentlab-sdk = { path = "../sdk", editable = true }
agentlab-backend = { path = "../backend", editable = true }
agentlab-world = { path = "../mock-world", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlab"]
