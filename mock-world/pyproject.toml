[project]
name = "agentlab-world"
version = "0.1.0"
description = "Agent Lab MockWorld: simulated reality over SQLite (SPEC §7-§9)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.141",
    "sqlmodel>=0.0.42",
    "agentlab-sdk",
]

[tool.uv.sources]
agentlab-sdk = { path = "../sdk", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlab"]
