[project]
name = "agentlab-onboarding"
version = "0.1.0"
description = "Agent Lab Onboarding coordinator agent (SPEC §11)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "google-adk>=2.8.0",
    "agentlab-sdk",
]

[tool.uv.sources]
agentlab-sdk = { path = "../../sdk", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlab"]
