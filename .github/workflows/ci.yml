name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-packages
      - name: Lint
        run: uv run ruff check sdk/src backend/src mock-world/src agents/onboarding/src
      - name: Type check
        run: uv run ty check sdk/src backend/src mock-world/src agents/onboarding/src
      - name: Tests
        run: uv run pytest
