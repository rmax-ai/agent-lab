name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-packages
      - name: Lint
        run: uv run ruff check sdk/src backend/src mock-world/src agents/onboarding/src agents/device agents/access cli/src
      - name: Type check
        run: uv run ty check sdk/src backend/src mock-world/src agents/onboarding/src agents/device agents/access cli/src
      - name: Tests
        run: uv run pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
