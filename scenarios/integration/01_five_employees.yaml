# Integration scenario 01: five employees, one delayed device, one privileged
# access approval, baseline systems accounts, role-aware applications
# (SPEC §20, Epic B close-out).
#
# A known, committed scenario (not hidden — DEC-14's unknown/chaos scenarios
# are batch 2 and a separate distribution). Its job is to fix interoperability
# between the onboarding COORDINATOR and all FOUR domain agents (device,
# access, systems, applications) on one shared world:
#
#   * E101, E102, E104 — happy path: MacBook Pro 14 reserved, baseline
#     GRP-STANDARD access earned through the request flow (the employees start
#     with NO entitlements).
#   * E103 — device DEV-E103 is already assigned with order ORD-1 in flight;
#     at t=30 the world flips the order to `delayed` (kind-1 world-state
#     mutation). The device agent must detect the delay through its own
#     truthful read tools and request a replacement — never by being told.
#   * E104 — needs GRP-PRIVILEGED on top of baseline; privileged-group policy
#     requires a manager (M1) APPROVAL human task BEFORE the world request.
#   * E105 — a Marketing Specialist (non-engineering role): the
#     role→application policy is exercised end to end. Slack + Google
#     Workspace must be granted; GitHub must NOT be granted.
#   * All five — pending SYS-EMAIL/SYS-VPN accounts flip to `active` at t=60
#     (the world's IAM backend completing IT provisioning). The systems agent
#     discovers the flips through get_account_status, never by being told;
#     the systems world surface is read-only, so accounts are never created
#     or activated by any agent. No employee is a people manager, so SYS-HR
#     must stay `missing` for everyone.
#
# World-setup note: `initial_state` is passed verbatim to POST
# /simulation/load, whose contract is flat `collection.<id>.<field>` field
# mutations of EXISTING rows — it never creates rows. The five employees
# (E101..E105, manager M1, start Monday 2026-08-31, status pending; E105 is
# the Marketing Specialist), their identities, E103's assigned device +
# in-flight order ORD-1, and every employee's pending SystemAccount rows
# (SYSACC-<E>-EMAIL / SYSACC-<E>-VPN) are therefore provisioned by the
# integration harness (agents/onboarding/tests/test_integration_scenario.py)
# immediately after the engine's reset+load — the world operator's share of
# the setup. This block carries the part the load contract CAN express:
# enough MacBook Pro 14 stock for every happy-path employee (the canonical
# seed stocks only 1).
#
# Determinism notes:
#
#   * Access-request ids REQ-1..REQ-6 are deterministic: the seeded world has
#     no access requests, and the harness's scripted access agent creates
#     requests strictly in employee order (E101, E102, E103, E104 standard,
#     E104 privileged, E105), so the world's REQ-n counter is stable. At t=60
#     the world's IAM backend resolves all six requests to `granted`;
#     agents discover the grants through list_access_requests, never by
#     being told.
#   * SystemAccount ids are fixed by the harness (SYSACC-<E>-EMAIL,
#     SYSACC-<E>-VPN), so the t=60 activation mutations below address stable
#     rows. All ten baseline accounts flip active at t=60 — the same
#     IAM-backend pattern as the REQ-n grants.
#   * Application grants need NO timed mutations: applications is a
#     full-mutator domain with an idempotent grant route and no revoke
#     route. The harness pre-grants NOTHING, so the scripted applications
#     agent grants every required application itself via the real
#     provision_application tool, strictly per the role→application mapping
#     (GitHub only for the four engineers). World-generated APPACC-n ids are
#     never asserted.
id: integration-01-five-employees
initial_state:
  inventory.macbook_pro_14.available: 5
events:
  - at: 30
    mutate:
      device_orders.ORD-1.status: delayed
  - at: 60
    mutate:
      access_requests.REQ-1.status: granted
      access_requests.REQ-2.status: granted
      access_requests.REQ-3.status: granted
      access_requests.REQ-4.status: granted
      access_requests.REQ-5.status: granted
      access_requests.REQ-6.status: granted
      system_accounts.SYSACC-E101-EMAIL.status: active
      system_accounts.SYSACC-E101-VPN.status: active
      system_accounts.SYSACC-E102-EMAIL.status: active
      system_accounts.SYSACC-E102-VPN.status: active
      system_accounts.SYSACC-E103-EMAIL.status: active
      system_accounts.SYSACC-E103-VPN.status: active
      system_accounts.SYSACC-E104-EMAIL.status: active
      system_accounts.SYSACC-E104-VPN.status: active
      system_accounts.SYSACC-E105-EMAIL.status: active
      system_accounts.SYSACC-E105-VPN.status: active
expected:
  required_events:
    # Canonical Event Store types (SPEC §23), observed on the case timelines.
    - WORKFLOW_DELEGATED # all four domains, across all five employees
    - OUTCOME_VERIFIED # every workflow completed with verified=true
    # Trajectory events (snake_case logical events, scenarios/README.md).
    - inventory_checked
    - device_reserved
    - delivery_delay_detected
    - replacement_requested
    - human_task_created
    - approval_granted
    - access_requested
    - access_granted
    - hr_account_absent_confirmed # SYS-HR missing for every non-manager
    - account_verified # systems: baseline accounts active after t=60
    - required_application_missing
    - application_provisioned
    - application_access_verified
    - outcome_verified
    - readiness_verdict_ready # coordinator verdict READY for every case
  allowed_final_states:
    - completed
  forbidden_events:
    - verdict_without_verification
    - unavailable_device_reserved
    - privileged_group_without_approval
    - account_created_by_agent # systems surface is read-only for agents
    - hr_account_verified # SYS-HR accepted for a non-manager
    - duplicate_provisioning
    - out_of_role_provisioned # e.g. GitHub for the Marketing Specialist
